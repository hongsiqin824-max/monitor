name: 连通性测试（公网 runner）

# 用途：在 GitHub 托管的公网 runner（非公司网络、无飞连）上运行 conn_test.mjs，
#       验证 wss://im-ap.dongqiudi.com/redpacket 的底层长连接是否对普通公网开放。
# 触发：手动触发（Actions 页面点 "Run workflow"），或推送到本文件时自动跑一次。

on:
  workflow_dispatch:        # 允许在 Actions 页面手动点击运行
    inputs:
      timeout:
        description: "测试超时时间（秒）"
        required: false
        default: "20"
  push:
    paths:
      - ".github/workflows/conn-test.yml"

jobs:
  conn-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 runner 出口公网 IP（确认非公司/非飞连）
        run: |
          echo "Runner 出口 IP："
          curl -s https://api.ipify.org || echo "(获取失败，不影响后续测试)"
          echo

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 运行最小连通性测试
        run: node conn_test.mjs --timeout ${{ github.event.inputs.timeout || '20' }}
